<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Jude's General Hospital Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Google Fonts for crisp clean look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0f1319] text-[#e2e8f0] min-h-screen p-4 flex items-center justify-center">

  <!-- Main Tablet Container: Restricted maximum width for a 9-inch physical look, responsive to orientation changes -->
  <div class="w-full max-w-2xl bg-[#141b22] border border-gray-800 rounded-2xl p-6 shadow-2xl flex flex-col justify-between min-h-[85vh]">
    
    <!-- Top Meta Container (Orientation Switcher Support) -->
    <div class="landscape:grid landscape:grid-cols-2 landscape:gap-6 space-y-6 landscape:space-y-0">
      
      <!-- Left Block / Portrait Top Part -->
      <div class="space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-start border-b border-gray-800 pb-4">
          <div>
            <h1 class="text-xl font-extrabold tracking-wide uppercase text-white leading-tight">
              St. Jude's General Hospital
            </h1>
            <p class="text-xs text-gray-500 font-mono mt-0.5">ultra-bold titleLarge, 32sp</p>
            
            <!-- Real-time dynamic date/time strings updated by JavaScript -->
            <div class="mt-4 text-sm font-semibold tracking-wide text-gray-300">
              <span id="live-date">JUNE 15, 2026</span>
              <span class="block text-lg font-bold text-white mt-0.5" id="live-time">11:15 AM</span>
            </div>
          </div>

          <div class="text-right">
            <h2 class="text-sm font-bold tracking-wide uppercase text-gray-300">Dr. Alex Mercer</h2>
            <div class="flex items-center justify-end gap-1.5 mt-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span class="text-xs font-bold text-emerald-500 tracking-wider">[ ONLINE ]</span>
            </div>
          </div>
        </header>

        <!-- Patient Overview Action Section -->
        <section class="bg-[#1c242c] border border-gray-800 rounded-xl p-4 space-y-3 shadow-inner">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Patient Overview</h3>
          
          <!-- New Patient Button -->
          <button class="w-full bg-[#22c55e] hover:bg-emerald-600 text-white font-black text-lg py-3.5 px-5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 uppercase tracking-wider group active:scale-95">
            <svg class="w-5 h-5 fill-current transform group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
            New Patient
          </button>

          <!-- Returning Patient Button -->
          <button class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-black text-lg py-3.5 px-5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 uppercase tracking-wider group active:scale-95">
            <svg class="w-5 h-5 stroke-current stroke-[3.5] fill-none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
            </svg>
            Returning Patient
          </button>

          <!-- Chirp Notification / Alert Area -->
          <button class="w-full bg-transparent border-2 border-[#ea580c] hover:bg-[#ea580c]/10 text-[#ea580c] font-black text-lg py-3 px-5 rounded-xl transition-all flex items-center justify-center gap-3 uppercase tracking-wider active:scale-95">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
            </svg>
            Chirp
          </button>
        </section>
      </div>

      <!-- Right Block / Portrait Bottom Part -->
      <div class="space-y-6">
        <!-- Consultation Metrics (Collapsible Accordion Component) -->
        <section class="bg-transparent border border-gray-700 rounded-xl overflow-hidden shadow-sm">
          <button id="accordion-toggle" class="w-full flex items-center justify-between p-4 bg-[#1a222a]/50 hover:bg-[#1a222a] transition-colors text-left focus:outline-none">
            <span class="text-xs font-bold text-gray-300 uppercase tracking-widest">
              Consultation Metrics <span class="text-[10px] text-gray-500 font-normal lowercase">(M3 Accordion)</span>
            </span>
            <svg id="accordion-arrow" class="w-4 h-4 text-gray-400 transform transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
          </button>
          
          <div id="accordion-content" class="p-4 pt-1 transition-all duration-300 ease-in-out">
            <div class="flex items-baseline gap-4 mt-1">
              <span class="text-6xl font-black tracking-tight text-white">24</span>
              <div>
                <div class="flex items-center text-emerald-500 font-bold text-sm">
                  <svg class="w-3.5 h-3.5 fill-current mr-0.5" viewBox="0 0 24 24">
                    <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
                  </svg>
                  +3.6%
                </div>
                <p class="text-[11px] text-gray-500 font-mono leading-none">bodyMedium, 16sp</p>
              </div>
            </div>
            <p class="text-xs font-bold text-gray-400 mt-2 tracking-wider">TOTAL 今日</p>
          </div>
        </section>

        <!-- Assistant Onboarding (Dynamic Grid Section) -->
        <section class="bg-transparent border border-gray-700 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-1.5">
              <!-- Star Sparkle Icon -->
              <svg class="w-4 h-4 text-white fill-current" viewBox="0 0 24 24">
                <path d="M12 2l2.4 7.2L22 10l-6 4.8L18.4 22 12 17.2 5.6 22 8 14.8 2 10l7.6-.8z"/>
              </svg>
              <h3 class="text-xs font-bold text-white uppercase tracking-wider">Assistant Onboarding</h3>
            </div>
            <span class="text-[11px] text-gray-400 font-medium">Onboard New</span>
          </div>

          <!-- Cards Grid Container -->
          <div class="grid grid-cols-3 gap-3">
            <!-- Add New Onboarding Action -->
            <div class="bg-[#171f26] border border-gray-700 rounded-xl p-3 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-800/50 hover:border-gray-500 transition-all group aspect-square">
              <div class="w-12 h-12 rounded-full border-2 border-dashed border-gray-500 flex items-center justify-center group-hover:scale-105 transition-transform">
                <svg class="w-6 h-6 text-gray-400 group-hover:text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
              </div>
              <span class="text-xs font-black text-gray-400 uppercase tracking-widest mt-2 group-hover:text-white">New</span>
            </div>

            <!-- Profile Block: Sara M. -->
            <div class="bg-[#171f26] border border-gray-700 rounded-xl p-3 flex flex-col items-center justify-center text-center aspect-square">
              <div class="w-12 h-12 rounded-full bg-gray-700 border border-gray-600 overflow-hidden flex items-center justify-center">
                <!-- SVG Avatar Replacement for Woman Vector Component -->
                <svg class="w-10 h-10 text-gray-300 mt-2" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
              <span class="text-xs font-black text-gray-200 uppercase tracking-widest mt-2 truncate w-full">Sara M.</span>
            </div>

            <!-- Profile Block: John D. -->
            <div class="bg-[#171f26] border border-gray-700 rounded-xl p-3 flex flex-col items-center justify-center text-center aspect-square">
              <div class="w-12 h-12 rounded-full bg-gray-700 border border-gray-600 overflow-hidden flex items-center justify-center">
                <!-- SVG Avatar Replacement for Man Vector Component -->
                <svg class="w-10 h-10 text-gray-300 mt-2" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
              <span class="text-xs font-black text-gray-200 uppercase tracking-widest mt-2 truncate w-full">John D.</span>
            </div>
          </div>
        </section>
      </div>

    </div>

    <!-- Interface Footer Rules -->
    <footer class="text-center pt-6 border-t border-gray-800/50 mt-6">
      <p class="text-[10px] text-gray-600 tracking-wide">
        All rights reserved. Terms and conditions apply.
      </p>
    </footer>

  </div>

  <!-- Interactive Logic Engine -->
  <script>
    // 1. Live Time and Date simulation string configurations
    function startLiveTime() {
      const liveDateEl = document.getElementById('live-date');
      const liveTimeEl = document.getElementById('live-time');
      
      function updateTime() {
        const now = new Date();
        
        // Match UI formatting rule options
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
        
        liveDateEl.textContent = now.toLocaleDateString('en-US', dateOptions).toUpperCase();
        liveTimeEl.textContent = now.toLocaleTimeString('en-US', timeOptions);
      }
      
      updateTime();
      setInterval(updateTime, 1000 * 60); // refresh every minute
    }

    // 2. M3 Accordion component interactive expand/collapse script actions
    function setupAccordion() {
      const toggleBtn = document.getElementById('accordion-toggle');
      const content = document.getElementById('accordion-content');
      const arrow = document.getElementById('accordion-arrow');

      toggleBtn.addEventListener('click', () => {
        if (content.classList.contains('hidden')) {
          content.classList.remove('hidden');
          arrow.classList.remove('rotate-180');
        } else {
          content.classList.add('hidden');
          arrow.classList.add('rotate-180');
        }
      });
    }

    // Initializer calls
    document.addEventListener('DOMContentLoaded', () => {
      startLiveTime();
      setupAccordion();
    });
  </script>
</body>
</html>
